<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadion test</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Barlow+Semi+Condensed:wght@700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; background: #14171a; color: #e9ecef; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: #1d2126; border-bottom: 1px solid #2c323a; }
    #bar strong { margin-right: 6px; }
    button, select { font: inherit; color: inherit; background: #2a3038; border: 1px solid #3a424d; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    button:hover { background: #343c46; }
    #status { margin-left: auto; color: #9aa4af; }
    #walk.on { background: #c8102e; border-color: #e0475f; }
    #walkhelp { position: fixed; left: 12px; bottom: 12px; padding: 10px 12px; background: rgba(20,23,26,.88); border: 1px solid #2c323a; border-radius: 4px; line-height: 1.5; }
    #walkhelp[hidden] { display: none; }
    #walkhelp kbd { display: inline-block; min-width: 18px; padding: 0 4px; text-align: center; background: #2a3038; border: 1px solid #3a424d; border-radius: 3px; font: 12px/18px system-ui, sans-serif; }
    #status.new { color: #7fd18b; }
    #status.err { color: #ff8a80; }
</style>
</head>
<body>
<div id="bar">
    <strong>Stadion test</strong>
    <select id="pick"></select>
    <button data-view="overzicht">Overzicht</button>
    <button data-view="wedstrijd">Wedstrijdcamera</button>
    <button data-view="tribune">Vanaf de tribune</button>
    <button data-view="boven">Van boven</button>
    <button data-view="ingang">Ingang</button>
    <button data-view="foto">Zoals foto 2</button>
    <button data-view="doel">Doel</button>
    <button data-view="dugouts">Dug-outs</button>
    <button id="walk" type="button">Rondlopen</button>
    <span id="status">laden…</span>
</div>
<div id="walkhelp" hidden>
    <strong>Rondlopen</strong><br>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> of pijltjes: lopen · <kbd>Shift</kbd> ingedrukt: rennen<br>
    <kbd>E</kbd> / <kbd>spatie</kbd>: omhoog (de tribune op) · <kbd>Q</kbd> / <kbd>C</kbd>: omlaag<br>
    slepen met de muis: rondkijken · <kbd>Esc</kbd>: stoppen
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="game.screen.js"></script>
<script>
// Shows a stadium .glb on its own and reloads it as soon as the file changes,
// so every new export from Blender appears here without refreshing.
const status = document.getElementById('status');
const pick = document.getElementById('pick');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x8fa3b5);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a6a55, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(120, 200, -80);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 5000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// camera spots, in "longest side = 1" units around the model's centre
const VIEWS = {
    overzicht: [[0.65, 0.6, -0.8], [0, 0.02, 0]],
    wedstrijd: [[0, 0.2, -0.3], [0, 0, 0.08]],
    tribune:   [[0.05, 0.075, -0.2], [0, 0.01, 0.1]],
    boven:     [[0, 1.2, -0.001], [0, 0, 0]],
    ingang:    [[0.25, 0.1, -0.75], [0, 0.05, -0.3]],
    foto:      [[0.2474, 0.0201, -0.0634], [-0.148, 0.0239, 0.0085]],     // as photo 2: low in the east end, facing RSC ANDERLECHT (west)
    dugouts:   [[0.042, 0.0135, 0.059], [-0.017, 0.0042, 0.152]],
    doel:      [[-0.1184, 0.0154, 0.0507], [-0.1945, 0.0057, 0]],
};
let span = 200, centre = new THREE.Vector3();
function setView(name) {
    const [p, t] = VIEWS[name];
    camera.position.set(centre.x + p[0] * span, centre.y + p[1] * span, centre.z + p[2] * span);
    controls.target.set(centre.x + t[0] * span, centre.y + t[1] * span, centre.z + t[2] * span);
    controls.update();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { setWalk(false); setView(b.dataset.view); });

// Rondlopen: a person on the pitch at eye height (1.7 m), walking with the
// keys and looking round by dragging; up and down to climb into the stands.
// Distances in metres, turned into model units from the pitch (105 m long).
const walk = { on: false, yaw: 0, pitch: 0, keys: {}, drag: null };
const walkBtn = document.getElementById('walk'), walkHelp = document.getElementById('walkhelp');
// the game scales a model to 264 across its longest side (span); the catalog's
// pitch.w is the 105 m pitch in those units, pitch.y its height over the model's foot
function metre() {
    const st = current();
    return st && st.pitch ? st.pitch.w * span / 264 / 105 : span / 300;
}
function groundY() {
    const st = current();
    return centre.y + (st && st.pitch ? (st.pitch.y || 0) * span / 264 : 0);
}
function setWalk(on) {
    if (on === walk.on) return;
    walk.on = on;
    walkBtn.classList.toggle('on', on);
    walkHelp.hidden = !on;
    controls.enabled = !on;
    if (on) {
        const m = metre();
        // start on the near touchline at the halfway line, looking across the pitch
        camera.fov = 70; camera.near = 0.05 * m; camera.updateProjectionMatrix();
        camera.position.set(centre.x, groundY() + 1.7 * m, centre.z - 40 * m);
        walk.yaw = Math.PI; walk.pitch = 0.08;
    } else {
        camera.fov = 40; camera.near = span / 2000; camera.updateProjectionMatrix();
        controls.target.copy(camera.position).add(new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(walk.pitch, walk.yaw, 0, 'YXZ')).multiplyScalar(span * 0.1));
        controls.update();
    }
}
walkBtn.onclick = () => setWalk(!walk.on);
addEventListener('keydown', (e) => {
    if (!walk.on) return;
    if (e.code === 'Escape') { setWalk(false); return; }
    walk.keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { walk.keys[e.code] = false; });
addEventListener('blur', () => { walk.keys = {}; });
renderer.domElement.addEventListener('pointerdown', (e) => {
    if (!walk.on) return;
    walk.drag = { x: e.clientX, y: e.clientY, yaw: walk.yaw, pitch: walk.pitch };
    renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
    if (!walk.on || !walk.drag) return;
    walk.yaw = walk.drag.yaw - (e.clientX - walk.drag.x) * 0.0045;
    walk.pitch = Math.max(-1.45, Math.min(1.45, walk.drag.pitch - (e.clientY - walk.drag.y) * 0.0045));
});
renderer.domElement.addEventListener('pointerup', () => { walk.drag = null; });
let walkLast = performance.now();
function walkStep() {
    const now = performance.now(), dt = Math.min(0.05, (now - walkLast) / 1000);
    walkLast = now;
    if (!walk.on) return;
    const k = walk.keys, m = metre();
    const speed = (k.ShiftLeft || k.ShiftRight ? 14 : 5) * m * dt;          // walking 5 m/s, running 14
    const fwd = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
    const side = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
    const up = (k.KeyE || k.Space ? 1 : 0) - (k.KeyQ || k.KeyC ? 1 : 0);
    const f = new THREE.Vector3(-Math.sin(walk.yaw), 0, -Math.cos(walk.yaw));     // where you look, flat
    const r = new THREE.Vector3(Math.cos(walk.yaw), 0, -Math.sin(walk.yaw));
    camera.position.addScaledVector(f, fwd * speed).addScaledVector(r, side * speed);
    camera.position.y = Math.max(groundY() + 1.7 * m, camera.position.y + up * 4 * m * dt);
    camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
}

// stadium list from the game's own catalog (read out of game.core.js without
// running the game); ?stadion=<id> picks one
let list = [];
async function readCatalog() {
    const src = await (await fetch('game.core.js', { cache: 'no-store' })).text();
    const m = src.match(/const STADIUMS = (\[[\s\S]*?\n\]);/);
    list = (m ? new Function('return ' + m[1])() : []).filter(s => s.file);
    list.forEach(s => pick.add(new Option(s.name, s.id)));
    const wanted = new URLSearchParams(location.search).get('stadion') || 'lotto-park';
    pick.value = list.some(s => s.id === wanted) ? wanted : (list[0] && list[0].id);
}
pick.onchange = () => { stamp = null; load(true); };

let model = null, stamp = null, busy = false;
function current() { return list.find(s => s.id === pick.value); }

function load(reframe) {
    const stadium = current();
    if (!stadium || busy) return;
    busy = true;
    status.className = ''; status.textContent = 'laden…';
    new THREE.GLTFLoader().load(encodeURI(stadium.file) + (stadium.file.includes('?') ? '&' : '?') + 't=' + Date.now(), (gltf) => {
        if (model) scene.remove(model);
        model = gltf.scene;
        // a stadium with its (night) light baked in is shown unlit, as the game draws it
        const baked = !!(stadium.look && stadium.look.baked);
        const gain = baked ? (stadium.look.gain ?? 1) : 1;
        renderer.setClearColor(baked ? 0x0b1220 : 0x8fa3b5);
        if (STADIUM_SCREEN.attach(model, stadium.screen, stadium.screenLogo)) STADIUM_SCREEN.update('00:00', 0, 0);       // the live screens, before kick-off
        model.traverse((c) => {
            if (!c.isMesh) return;
            if (baked) {
                const swap = (m) => {
                    const b = new THREE.MeshBasicMaterial({
                        map: m.map || null,
                        color: (m.color ? m.color.clone() : new THREE.Color(1, 1, 1)).multiplyScalar(gain),
                        vertexColors: m.vertexColors,
                        transparent: m.transparent, opacity: m.opacity, alphaTest: m.alphaTest,
                        side: m.side, depthWrite: m.depthWrite,
                    });
                    b.toneMapped = false;
                    return b;
                };
                c.material = Array.isArray(c.material) ? c.material.map(swap) : swap(c.material);
                return;
            }
            (Array.isArray(c.material) ? c.material : [c.material]).forEach((m) => {
                if (m.metalness !== undefined && !m.metalnessMap && m.metalness >= 0.9) m.metalness = 0;
            });
        });
        scene.add(model);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        if (reframe) {
            span = Math.max(size.x, size.z);
            box.getCenter(centre); centre.y = box.min.y;
            camera.far = span * 20; camera.near = span / 2000; camera.updateProjectionMatrix();
            setView('overzicht');
        }
        busy = false;
        status.className = 'new';
        status.textContent = stadium.name + ' · bijgewerkt ' + new Date().toLocaleTimeString('nl-BE');
    }, undefined, (err) => {
        busy = false;
        status.className = 'err';
        status.textContent = 'kon ' + stadium.file + ' niet laden';
        console.error(err);
    });
}

// reload when the file on disk is newer than the one on screen
async function watch() {
    const stadium = current();
    if (!stadium || busy) return;
    try {
        const r = await fetch(encodeURI(stadium.file), { method: 'HEAD', cache: 'no-store' });
        const s = r.headers.get('last-modified') + '|' + r.headers.get('content-length');
        if (stamp === null) stamp = s;
        else if (s !== stamp) { stamp = s; load(false); }
    } catch (_) { /* server stopped: keep showing what we have */ }
}
setInterval(watch, 2000);

function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
readCatalog().then(() => load(true)).catch((e) => { status.className = 'err'; status.textContent = 'kon de stadionlijst niet lezen'; console.error(e); });
(function frame() { requestAnimationFrame(frame); if (walk.on) walkStep(); else controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
