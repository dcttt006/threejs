<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAR test</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
    html, body { margin: 0; height: 100%; background: #14171a; color: #e9ecef; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px; background: #1d2126; border-bottom: 1px solid #2c323a; }
    #bar strong { margin-right: 4px; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-right: 10px; border-right: 1px solid #2c323a; }
    .group:last-of-type { border-right: 0; }
    .group span { color: #9aa4af; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    button, select { font: inherit; color: inherit; background: #2a3038; border: 1px solid #3a424d; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    button:hover { background: #343c46; }
    button:disabled { opacity: .45; cursor: default; }
    #status { margin-left: auto; color: #9aa4af; white-space: nowrap; }
    #status.busy { color: #ffd60a; }
    #status.ok { color: #7fd18b; }
    iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div id="bar">
    <strong>VAR test</strong>
    <label class="group" title="Wie staat buitenspel, maakt de overtreding of scoort"><span>Wie doet het</span>
        <select id="side">
            <option value="2">Blauw (computer)</option>
            <option value="1">Rood (jij)</option>
        </select>
    </label>
    <div class="group"><span>Buitenspel</span>
        <button data-s="offside">Vlag + vrije trap</button>
        <button data-s="goalOff">Goal, VAR: buitenspel</button>
        <button data-s="goalOn">Goal, VAR: telt</button>
    </div>
    <div class="group"><span>Strafschop</span>
        <button data-s="penYes">Overtreding → penalty</button>
        <button data-s="penNo">Overtreding → geen penalty</button>
        <button data-s="hands">Hands → penalty</button>
        <button data-s="handsNo">Hands → geen penalty</button>
    </div>
    <div class="group"><span>Kaarten</span>
        <button data-s="redYes">Rood, VAR bevestigt</button>
        <button data-s="redNo">Rood → VAR: geel</button>
        <button data-s="yellow">Geel</button>
        <button data-s="second">Tweede geel</button>
    </div>
    <div class="group">
        <button id="take" title="Neemt de vrije trap of strafschop die klaarligt">Hervatting nemen</button>
    </div>
    <span id="status">laden…</span>
</div>
<iframe id="game" src="index.html?vartest" title="Pitch Royale"></iframe>

<script>
// Every scene below is set up in the real game (index.html in the frame),
// played for a moment so the replay has something to show, and then the
// referee (game.referee.js) is told how the call goes (REF.force), so each
// button always ends the same way.
const HELPER = `
window.__vt = (() => {
    const T = (t) => t === 1 ? team1Players : team2Players;
    const dir = (t) => t === 1 ? 1 : -1;
    const pos = (p, x, z) => {
        p.position.set(x, 0, z);
        const u = p.userData;
        u.vx = 0; u.vz = 0; u.lastX = x; u.lastZ = z; u.tackleT = 0; u.getUpT = 0; u.fallT = 0;
        u.cooldown = 0; u.charging = false; u.volley = null;
    };
    let timers = [];
    const later = (f, ms) => timers.push(setTimeout(f, ms));
    const every = (f, ms) => { const id = setInterval(f, ms); timers.push(id); return id; };
    const stop = () => { timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers = []; };
    function ready() {
        return STATE.screen === 'playing' && !STATE.inputLocked && !STATE.scoring && !STATE.setPiece && !REF.active && !STATE.paused;
    }
    function fresh() {
        stop();
        carrier = null; passTarget = null; lastKick = null; curl = null; ballCall = null;
        [...team1Players, ...team2Players].forEach(p => { p.userData.holdingBall = false; p.userData.shield = 0; });
        ball.velocity = { x: 0, y: 0, z: 0 };
        STATE.inputLocked = true;              // the computer stands still while the scene is set up
    }
    // the keepers in goal, everyone not in the scene out of the way
    function park(keep, A, defendersBehind) {
        const g = dir(A);
        let ia = 0, id = 0;
        [...team1Players, ...team2Players].forEach((p) => {
            if (keep.includes(p)) return;
            if (p.userData.isKeeper) { pos(p, -dir(p.team) * (FIELD_W / 2 - 4), 0); return; }
            if (p.team === A) { pos(p, g * -40, -40 + 26 * ia++); return; }
            pos(p, g * (defendersBehind ? -55 : -10), 40 - 26 * id++);
        });
    }
    // moves the players a step at a time for ms; the one with the ball keeps it at his feet
    function run(moves, ms, withBall, done) {
        const t0 = performance.now();
        const id = every(() => {
            const k = Math.min(1, (performance.now() - t0) / ms);
            moves.forEach(([p, x0, z0, x1, z1]) => {
                p.position.x = x0 + (x1 - x0) * k;
                p.position.z = z0 + (z1 - z0) * k;
                p.userData.vx = (x1 - x0) / ms * 16; p.userData.vz = (z1 - z0) / ms * 16;
            });
            if (withBall) {
                carrier = withBall;
                withBall.userData.shield = 9999;
                withBall.userData.aimX = dir(withBall.team); withBall.userData.aimZ = 0;
            }
            if (k >= 1) { clearInterval(id); done(); }
        }, 16);
    }
    // play goes on (the computer moves again) once the referee has stopped it
    function release() {
        const t0 = performance.now();
        const id = every(() => {
            if (REF.active || STATE.scoring || performance.now() - t0 > 5000) {
                clearInterval(id);
                if (!STATE.scoring) STATE.inputLocked = false;
                [...team1Players, ...team2Players].forEach(p => { p.userData.shield = 0; });
            }
        }, 30);
    }

    // ---------- offside: A attacks, a pass to a man beyond their line (55)
    function offsidePass(A, endA, how) {
        const D = 3 - A, g = dir(A), a = T(A), d = T(D);
        const passer = a.find(p => p.userData.role === 'att') || a[1];
        const runner = a.find(p => p.userData.role === 'rw') || a[2];
        const defs = d.filter(p => !p.userData.isKeeper);
        // out of the line of the pass, the deepest of them (55) is the offside line
        [[48, -40], [52, 8], [55, 26], [45, 42]].forEach(([x, z], i) => defs[i] && pos(defs[i], g * x, z));
        park([passer, runner, ...defs], A);
        pos(passer, g * -5, 0); pos(runner, g * 30, -18);
        ball.position.set(passer.position.x + g * 3, BALL_SIZE, 0);
        run([[passer, g * -5, 0, g * 10, 0], [runner, g * 30, -18, g * endA, -18]], 1300, passer, () => {
            passer.userData.shield = 0;
            REF.force({ kind: 'offside', seen: how === 'flag' });
            passBall(passer, runner);
            if (how === 'flag') { release(); return; }
            // not flagged: he takes it and scores, then the VAR looks
            const t0 = performance.now();
            const id = every(() => {
                if (carrier === runner) {
                    clearInterval(id);
                    const k = T(D)[0];
                    pos(k, g * (FIELD_W / 2 - 4), 30);
                    runner.userData.aimX = g; runner.userData.aimZ = -0.8;
                    fireShot(runner, POWER_MAX, 1, false, { power: true });
                    // the keeper stays out of it: this scene is about the goal, not the save
                    const hold = every(() => {
                        if (STATE.scoring) { clearInterval(hold); return; }
                        pos(k, g * (FIELD_W / 2 - 4), 30);
                        k.userData.holdingBall = false; k.userData.diveT = 0;
                    }, 8);
                    later(() => { clearInterval(hold); if (!STATE.scoring) scoreGoal(A); }, 650);
                } else if (performance.now() - t0 > 4000) { clearInterval(id); STATE.inputLocked = false; }
            }, 16);
        });
    }

    // ---------- a foul: on the man on the ball (side A), by side O, from behind
    function foul(O, xFrom, xTo, force, opts) {
        opts = opts || {};
        const A = 3 - O, g = dir(A), a = T(A), o = T(O);
        const victim = a.find(p => p.userData.role === 'att') || a[1];
        const fouler = o.find(p => p.userData.role === 'def') || o[1];
        park([victim, fouler], A, true);
        if (opts.yellows) fouler.userData.yellows = opts.yellows;
        pos(victim, g * xFrom, 4); pos(fouler, g * (xFrom - 9), 6);
        ball.position.set(victim.position.x + g * 3, BALL_SIZE, 4);
        run([[victim, g * xFrom, 4, g * xTo, 2], [fouler, g * (xFrom - 9), 6, g * (xTo - 3.2), 2.4]], 1400, victim, () => {
            victim.userData.shield = 0;
            fouler.userData.tackleT = 6;          // in the slide as he gets there
            REF.force(Object.assign({ kind: 'foul' }, force));
            REF.onChallenge(fouler, victim, true);
            release();
        });
    }

    // ---------- handball: side A shoots, a defender of O in his box gets it on the arm
    function hands(O, force) {
        const A = 3 - O, g = dir(A), a = T(A), o = T(O);
        const shooter = a.find(p => p.userData.role === 'att') || a[1];
        const def = o.find(p => p.userData.role === 'def') || o[1];
        park([shooter, def], A, true);
        pos(def, g * 74, 0.6);
        pos(shooter, g * 35, 0);
        ball.position.set(shooter.position.x + g * 3, BALL_SIZE, 0);
        run([[shooter, g * 35, 0, g * 48, 0]], 1000, shooter, () => {
            shooter.userData.shield = 0;
            shooter.userData.aimX = g; shooter.userData.aimZ = 0;
            fireShot(shooter, POWER_MIN + (POWER_MAX - POWER_MIN) * 0.55, 0.55, true);
            const t0 = performance.now();
            const id = every(() => {
                const d = Math.hypot(ball.position.x - def.position.x, ball.position.z - def.position.z);
                if (d < 6 || performance.now() - t0 > 1500) {
                    clearInterval(id);
                    REF.force(Object.assign({ kind: 'hands' }, force));
                    REF.onBlock(def, A);
                    release();
                }
            }, 8);
        });
    }

    const SCENES = {
        offside: (S) => offsidePass(S, 72, 'flag'),
        goalOff: (S) => offsidePass(S, 57, 'goal'),
        goalOn:  (S) => offsidePass(S, 54.4, 'goal'),
        penYes:  (S) => foul(S, 30, 80, { stands: true, card: 'yellow' }),
        penNo:   (S) => foul(S, 30, 80, { stands: false, card: null }),
        hands:   (S) => hands(S, { stands: true, card: 'yellow' }),
        handsNo: (S) => hands(S, { stands: false, card: null }),
        redYes:  (S) => foul(S, -10, 35, { card: 'red', stands: true }),
        redNo:   (S) => foul(S, -10, 35, { card: 'red', stands: false }),
        yellow:  (S) => foul(S, -40, -5, { card: 'yellow' }),
        second:  (S) => foul(S, -40, -5, { card: 'yellow' }, { yellows: 1 }),
    };
    return {
        ready,
        play(name, against) {
            if (!ready() || !SCENES[name]) return false;
            fresh();
            SCENES[name](against);
            return true;
        },
        take() {
            const sp = STATE.setPiece;
            if (!sp || sp.phase !== 'ready') return false;
            if (sp.kind === 'penalty') shootSetPiece(Math.random() < 0.5 ? -1 : 1); else takeSetPiece(null);
            return true;
        },
        status() {
            const i = REF.active;
            if (STATE.screen !== 'playing') return ['laden…', 'busy'];
            if (STATE.inputLocked && !i && !STATE.scoring) return ['scène opzetten / aftrap…', 'busy'];
            if (i) {
                const names = { wait: 'goal gevierd', whistle: 'fluitsignaal', check: 'VAR-check', walk: 'scheidsrechter naar het scherm',
                    tv: 'review', replay: 'herhaling', decide: 'beslissing', card: 'kaart', restart: 'hervatting' };
                return [i.kind + ' · ' + (names[i.phase] || i.phase), 'busy'];
            }
            if (STATE.scoring) return ['goal · terug naar de aftrap', 'busy'];
            if (STATE.setPiece) return [STATE.setPiece.kind + ' klaar om te nemen', 'busy'];
            return ['spel loopt: kies een situatie', 'ok'];
        },
    };
})();`;

const frame = document.getElementById('game');
const statusEl = document.getElementById('status');
let win = null;

frame.addEventListener('load', () => {
    win = frame.contentWindow;
    // a match against the computer that never ends
    const boot = setInterval(() => {
        if (!win.document || win.document.readyState !== 'complete' || typeof win.startGame !== 'function') return;
        clearInterval(boot);
        win.eval(HELPER);
        win.eval(`
            STATE.mode = 'cpu'; STATE.wkMatch = null; STATE.goldenGoal = false;
            STATE.p1.name = 'Rood'; STATE.p1.team = 1; STATE.p2.name = 'Blauw'; STATE.p2.team = 2;
            STATE.kickoffTeam = 1; STATE.gameDuration = Infinity;
            startGame();
        `);
        frame.focus();
    }, 100);
});

document.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => {
    if (!win || !win.__vt) return;
    const against = Number(document.getElementById('side').value);
    if (!win.__vt.play(b.dataset.s, against)) {
        statusEl.textContent = 'wacht tot het spel weer loopt';
        statusEl.className = 'busy';
    }
    frame.focus();
}));
document.getElementById('take').addEventListener('click', () => {
    if (win && win.__vt) win.__vt.take();
    frame.focus();
});

setInterval(() => {
    if (!win || !win.__vt) return;
    let st;
    try { st = win.__vt.status(); } catch (_) { return; }
    statusEl.textContent = st[0];
    statusEl.className = st[1];
    const ok = win.__vt.ready();
    document.querySelectorAll('[data-s]').forEach(b => { b.disabled = !ok; });
}, 250);
</script>
</body>
</html>
